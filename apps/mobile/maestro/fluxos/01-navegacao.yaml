# Feed um por tela, troca de abas e Agenda com o dia escolhido.
appId: br.com.rowle
name: Navegação entre rolês e abas
---
- runFlow: ../comum/abrir.yaml
# O feed abre em "Hoje" quando há rolê hoje (inclusive eventos de amostra do banco
# local, com um só). Em "Próximos" sempre há os rolês dos fixtures para deslizar.
- tapOn: "Filtros"
- tapOn: "Limpar"
- tapOn: "Ver .* rol.*"
- assertVisible: "Dia: Próximos.*"
- assertVisible: "1 de .*"
- retry:
    maxRetries: 2
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 20%
          duration: 400
      - extendedWaitUntil:
          visible: "2 de .*"
          timeout: 5000
- tapOn: "Agenda"
- tapOn: ".* ${AMANHA}, .*rol.*"
- assertVisible: "Forró Maestro na Praça.*"
- tapOn: "Explorar"
- assertVisible: "Categorias"
- tapOn: "Você"
- assertVisible: "Nada salvo ainda"
- tapOn: "Ver rolês"
- assertVisible: ".*deslize para o próximo"
