# Busca sem resultado, link para rolê que não existe e rolê cancelado.
appId: br.com.rowle
name: Casos negativos
---
- runFlow: ../comum/abrir.yaml
- tapOn: "Explorar"
- tapOn: "Artista, lugar ou rolê"
- inputText: "zzzz nada"
- assertVisible: "Nada encontrado"
# Cancelado sai da descoberta.
- tapOn: "Limpar busca"
- tapOn: "Artista, lugar ou rolê"
- inputText: "sarau cancelado maestro"
- assertVisible: "Nada encontrado"
# Quem tem o link de um rolê cancelado vê o aviso e o motivo, sem botão de compra.
- openLink: "rowle:///evento/maestro-cancelado"
- extendedWaitUntil:
    visible: "Cancelado"
    timeout: 15000
- assertVisible: "Chuva forte no local."
- assertNotVisible: "Comprar ingresso.*"
- assertNotVisible: "Como chegar.*"
# Link para um rolê que não existe.
- openLink: "rowle:///evento/maestro-nao-existe"
- extendedWaitUntil:
    visible: "Esse rolê não está mais no Rowlê"
    timeout: 15000
- tapOn: "Ver outros rolês"
- assertVisible: ".*deslize para o próximo"
