<!DOCTYPE html>

    .you-city {

    .nav {

    .nav[hidden] { display: none; }
    .nav button {

    .share {

  <div class="phone" id="phone">
    <div class="screen" id="home"></div>
    <div class="screen" id="explore" hidden></div>

    <div class="nav" id="nav">
      <button id="nav-home" class="on" onclick="showTab('home')">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"></path></svg>
        INÍCIO
      </button>
      <button id="nav-explore" onclick="openExplore()">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        EXPLORAR
      </button>
      <button id="nav-saved" onclick="openSaved()">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10z"></path></svg>

        <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z"></path></svg>
        VOCÊ
      </button>

  <p class="hint">Preview no navegador — o app real é Android/iOS</p>
  <script>
    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }
    function addDays(d, n) {
      const x = new Date(d);
      x.setDate(x.getDate() + n);
      return startOfDay(x);
    }
    function nextDow(from, dow) {
      const x = startOfDay(from);
      while (x.getDay() !== dow) x.setDate(x.getDate() + 1);
      return startOfDay(x);
    }
    const today = startOfDay(new Date());
    const tomorrow = addDays(today, 1);
    const saturday = nextDow(today, 6);
    const sunday = nextDow(today, 0);
    const months = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    function sameDay(a, b) { return a.getTime() === b.getTime(); }
    function thisWeekend() {
      const dow = today.getDay();
      if (dow === 6) return { sat: today, sun: addDays(today, 1) };
      if (dow === 0) return { sat: addDays(today, -1), sun: today };
      return { sat: saturday, sun: sunday };
    }
    function weekTitle() {
      const dow = today.getDay();
      const monday = addDays(today, dow === 0 ? -6 : 1 - dow);
      const sunday = addDays(monday, 6);
      const startMonth = months[monday.getMonth()];
      const endMonth = months[sunday.getMonth()];
      const label = monday.getMonth() === sunday.getMonth()
        ? monday.getDate() + "–" + sunday.getDate() + " " + startMonth
        : monday.getDate() + " " + startMonth + " – " + sunday.getDate() + " " + endMonth;
      return label.toUpperCase();
    }
    function dateLabel(date) {
      const w = thisWeekend();
      if (sameDay(date, today)) return "Hoje";
      if (sameDay(date, tomorrow)) return "Amanhã";
      if (sameDay(date, w.sat)) return "Sábado";
      if (sameDay(date, w.sun)) return "Domingo";
      return date.getDate() + " " + months[date.getMonth()];
    }
    function formatWhen(e) { return dateLabel(e.date) + " • " + e.time; }
    function iconCal() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>';
    }
    function iconPin() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>';
    }
    function ymd(y, m, d) { return startOfDay(new Date(y, m - 1, d)); }
    function eachDay(start, end) {
      const out = [];
      for (let d = startOfDay(start); d.getTime() <= end.getTime(); d = addDays(d, 1)) out.push(d);
      return out;
    }
    function nextSession(sessions) {
      return sessions
        .filter(s => s.date.getTime() >= today.getTime())
        .sort((a, b) => a.date - b.date || a.time.localeCompare(b.time))[0] || null;
    }
    function withSession(session, event) {
      if (!session) return null;
      return Object.assign({}, event, { date: session.date, time: session.time });
    }
    const toysSession = nextSession(
      eachDay(ymd(2026, 8, 18), ymd(2026, 9, 27))
        .filter(d => d.getDay() !== 1)
        .map(date => ({ date, time: "10:00" }))
    );
    const orwellSession = nextSession([
      { date: ymd(2026, 9, 25), time: "20:00" },
      { date: ymd(2026, 9, 27), time: "16:00" }
    ]);
    const aranhaSession = nextSession([
      { date: ymd(2026, 9, 26), time: "16:00" },
      { date: ymd(2026, 9, 27), time: "16:00" }
    ]);
    const choroSession = nextSession([
      { date: ymd(2026, 9, 26), time: "10:00" },
      { date: ymd(2026, 9, 27), time: "10:00" }
    ]);
    const magalSession = nextSession([
      { date: ymd(2026, 9, 26), time: "21:00" }
    ]);
    const areaOrder = ["Norte", "Asa Sul", "Eixo", "Águas Claras", "Taguatinga"];
    const events = [
      withSession(toysSession, { id: "toys", title: "O Que Nos Habita", description: "Pinturas e esculturas inéditas de Daniel Toys, sobre memória e paisagem afetiva.", category: "Cultura", location: "Espaço Cultural Renato Russo — 508 Sul", area: "Asa Sul", price: "Grátis", link: "https://www.correiobraziliense.com.br/divirtasemais/2026/08/7482258-daniel-toys-busca-memorias-afetivas-e-sonhos-em-pinturas-e-esculturas.html", facts: [{ label: "Até", value: "27 de setembro" }, { label: "Funciona", value: "Terça a domingo, 10h às 20h" }, { label: "Sala", value: "Galeria Rubem Valentim" }] }),
      withSession(orwellSession, { id: "orwell", title: "2+2=5", description: "Peça da Agrupação Teatral Amacaca, inspirada em 1984, de George Orwell. Direção de Felipe Vidal.", category: "Teatro", location: "Teatro dos Ventos — Águas Claras", area: "Águas Claras", price: "R$ 20", link: "https://www.sympla.com.br/evento/2-2-5-da-agrupacao-teatral-amacaca/3543915", ageRating: "14 anos", facts: [{ label: "Meia", value: "R$ 10" }, { label: "Também", value: "Domingo 27, 16h e 19h" }, { label: "Acesso", value: "Libras e audiodescrição no dia 27" }, { label: "Quem", value: "Agrupação Teatral Amacaca" }] }),
      withSession(aranhaSession, { id: "aranha", title: "Aranhaverso", description: "O Homem-Aranha cai no multiverso. Espetáculo da Néia e Nando Cia. Teatral, para a família.", category: "Teatro", location: "Teatro Brasília Shopping — Asa Norte", area: "Norte", price: "R$ 40", link: "https://visitebrasilia.com.br/noticias/aranhaverso-leva-homem-aranha-e-aventura-pelo-multiverso-ao-teatro-brasilia-shopping", ageRating: "Livre", facts: [{ label: "Meia", value: "R$ 20" }, { label: "Sessões", value: "26 e 27 de setembro, às 16h" }, { label: "Bilheteria", value: "A partir das 15h, no teatro" }, { label: "Quem", value: "Néia e Nando Cia. Teatral" }] }),
      withSession(choroSession, { id: "choro", title: "Choro Permanente", description: "Roda ao ar livre na feira, com o grupo Saudando o Choro. Clássicos, autorais e convidados.", category: "Shows", location: "Feira Permanente de Taguatinga — QNL", area: "Taguatinga", price: "Grátis", link: "https://www.correiobraziliense.com.br/diversao-e-arte/2026/09/7497060-saudando-o-choro-ocupa-feira-em-taguatinga-ate-o-fim-de-setembro.html", facts: [{ label: "Até", value: "12h" }, { label: "Também", value: "Domingo, no mesmo horário" }, { label: "Com", value: "Leo Araújo, Nelson Latif e Rosemaria" }, { label: "Quem", value: "Saudando o Choro" }] }),
      withSession(magalSession, { id: "magal", title: "Baile do Magal", description: "Sidney Magal canta Sandra Rosa Madalena, Meu Sangue Ferve por Você, Me Chama Que Eu Vou e clássicos para dançar. O valor do ingresso está na Blue Ticket.", category: "Shows", location: "Centro de Convenções Ulysses Guimarães", area: "Eixo", price: "Ver ingresso", link: "https://www.blueticket.com.br/evento/41228", cover: "covers/cover_1.jpg", facts: [{ label: "Portões", value: "19h30" }, { label: "Sala", value: "Auditório Master" }, { label: "Quem", value: "Sidney Magal" }] })
    ].filter(Boolean).sort((a, b) => a.date - b.date || a.time.localeCompare(b.time));
    const areas = areaOrder.filter(area => events.some(e => e.area === area));
    const categories = [...new Set(events.map(e => e.category))];
    const whenFilters = [
      { id: "todos", label: "Todos" },
      { id: "hoje", label: "Hoje" },
      { id: "amanha", label: "Amanhã" },
      { id: "fim", label: "Fim de semana" }
    ];
    let selectedArea = null;
    let exploreQuery = "";
    let exploreCategory = null;
    let exploreWhen = "todos";
    let detailFrom = "home";
    const FAV_KEY = "rowle.favorites";
    const favorites = new Set();
    function loadFavorites() {
      try {
        const raw = localStorage.getItem(FAV_KEY);
        if (!raw) return;
        JSON.parse(raw).forEach(id => favorites.add(id));
      } catch (e) {}
    }
    function persistFavorites() {
      localStorage.setItem(FAV_KEY, JSON.stringify([...favorites]));
    }
    function toggleFav(id) {
      if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
      persistFavorites();
    }
    loadFavorites();
    function heartSvg(on) {
      return on
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10z"></path></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.1 8.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10S5 16.4 5 11a4 4 0 0 1 7.1-2.4z"></path></svg>';
    }
    function heartButton(id) {
      const on = favorites.has(id);
      return `<button type="button" class="heart ${on ? "on" : ""}" data-id="${id}" aria-label="${on ? "Remover dos salvos" : "Salvar evento"}">${heartSvg(on)}</button>`;
    }
    function posterStyle(e) {
      let h = 0;
      const s = String(e.id);
      for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
      return Math.abs(h) % 3;
    }
    function posterMark(e) {
      const ch = (e.title || "").trim().charAt(0);
      return ch ? ch.toUpperCase() : "";
    }
    function coverAttr(e) {
      return e.cover ? ` style="background-image:url('${e.cover}')"` : "";
    }
    function scrimHtml(e) {
      return e.cover ? `<span class="photo-scrim" aria-hidden="true"></span>` : "";
    }
    function posterHtml(e) {
      return `
        <div class="poster" data-id="${e.id}">
          <div class="poster-cover style-${posterStyle(e)}"${coverAttr(e)}>
            ${scrimHtml(e)}
            <span class="poster-mark" aria-hidden="true">${posterMark(e)}</span>
            <span class="badge ${e.category}">${e.category.toUpperCase()}</span>
            ${heartButton(e.id)}
            <div class="poster-title">${e.title}</div>
          </div>
          <div class="poster-meta">${formatWhen(e)}</div>
          <div class="poster-meta">${e.location}  ·  ${e.price}</div>
        </div>`;
    }
    function emptyHtml() {
      const q = (document.getElementById("q")?.value || "").trim();
      let title = "Ela ainda não achou";
      let subtitle = "Quando tiver rolê novo, aparece nessa lista.";
      if (q) {
        title = "Ela ainda não achou “" + q + "”";
        subtitle = "Tenta outro nome, ou limpa a busca e os filtros.";
      } else if (selectedArea) {
        title = "Nada cavado em " + selectedArea;
        subtitle = "Escolhe outro lugar ou vê todos os rolês.";
      }
      const hasFilters = q || selectedArea;
      const btn = hasFilters ? `<button type="button" id="clear-filters">Limpar filtros</button>` : "";
      return `<div class="empty"><h4>${title}</h4><p>${subtitle}</p>${btn}</div>`;
    }
    function renderHome() {
      const prev = document.getElementById("q");
      const qValue = prev ? prev.value : "";
      const q = qValue.toLowerCase();
      const keepFocus = document.activeElement === prev;
      const caret = prev && typeof prev.selectionStart === "number" ? prev.selectionStart : qValue.length;
      const filtered = events.filter(e => {
        const areaOk = !selectedArea || e.area === selectedArea;
        const qOk = !q || e.title.toLowerCase().includes(q) || e.category.toLowerCase().includes(q) || e.location.toLowerCase().includes(q) || e.area.toLowerCase().includes(q);
        return areaOk && qOk;
      });
      const nestaSemana = filtered.filter(e => !sameDay(e.date, today));
      const hoje = filtered.filter(e => sameDay(e.date, today));
      const places = areas.map((area, i) => {
        const dot = i === 0 ? "" : `<span class="dot">·</span>`;
        return `${dot}<button class="place ${selectedArea === area ? "on" : ""}" data-area="${area}">${area.toUpperCase()}</button>`;
      }).join("");
      let body;
      if (!filtered.length) {
        body = emptyHtml();
      } else {
        body = "";
        if (hoje.length) {
          body += `
            <div class="section">
              <div class="section-name">HOJE</div>
              <div class="slash"></div>
              <p class="section-sub">Ainda dá tempo de ir</p>
            </div>
            <div class="row-scroll">${hoje.map(posterHtml).join("")}</div>`;
        }
        if (nestaSemana.length) {
          body += `
            <div class="section">
              <div class="section-name">${weekTitle()}</div>
              <div class="slash"></div>
              <p class="section-sub">O que ela cavou nesta semana</p>
            </div>
            <div class="row-scroll">${nestaSemana.map(posterHtml).join("")}</div>`;
        }
      }
      document.getElementById("home").innerHTML = `
        <div class="brand pad">
          <div class="brand-row">
            <img class="wordmark" src="wordmark.png" alt="Rowlê" />
            <span class="city">BSB / DF</span>
          </div>
          <p class="subtitle">O que ela cavou hoje em Brasília.</p>
        </div>
        <div class="places">${places}</div>
        <div class="search-wrap">
          <span class="icon" aria-hidden="true">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-3.5-3.5"></path>
            </svg>
          </span>
          <input class="search" id="q" placeholder="Buscar um rolê" value="${qValue.replace(/"/g, "&quot;")}" />
        </div>
        ${body}
      `;
      document.querySelectorAll(".place").forEach(btn => {
        btn.onclick = () => {
          const value = btn.getAttribute("data-area");
          selectedArea = selectedArea === value ? null : value;
          renderHome();
        };
      });
      document.querySelectorAll(".poster").forEach(card => {
        card.onclick = () => openDetail(card.getAttribute("data-id"), "home");
      });
      document.querySelectorAll("#home .heart").forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          const id = btn.getAttribute("data-id");
          toggleFav(id);
          renderHome();
        };
      });
      const input = document.getElementById("q");
      input.addEventListener("input", renderHome);
      const clear = document.getElementById("clear-filters");
      if (clear) clear.onclick = () => {
        selectedArea = null;
        document.getElementById("q").value = "";
        renderHome();
      };
      if (keepFocus) {
        input.focus();
        input.setSelectionRange(caret, caret);
      }
    }
    function matchesWhen(e) {
      if (exploreWhen === "hoje") return sameDay(e.date, today);
      if (exploreWhen === "amanha") return sameDay(e.date, tomorrow);
      if (exploreWhen === "fim") {
        const w = thisWeekend();
        return sameDay(e.date, w.sat) || sameDay(e.date, w.sun);
      }
      return true;
    }
    function chipHtml(label, on, attrs) {
      return `<button type="button" class="chip ${on ? "on" : ""}" ${attrs}>${label.toUpperCase()}</button>`;
    }
    function emptyExploreHtml() {
      const q = exploreQuery.trim();
      const hasFilters = q || exploreCategory || exploreWhen !== "todos";
      let title = "Ela ainda não achou";
      let subtitle = "Quando tiver rolê novo, aparece nessa lista.";
      if (q) {
        title = "Ela ainda não achou “" + q + "”";
        subtitle = "Tenta outro nome, ou limpa a busca e os filtros.";
      } else if (hasFilters) {
        title = "Ela ainda não achou com isso";
        subtitle = "Tenta outra categoria, data ou busca.";
      }
      const btn = hasFilters ? `<button type="button" id="clear-explore">Limpar filtros</button>` : "";
      return `<div class="empty"><h4>${title}</h4><p>${subtitle}</p>${btn}</div>`;
    }
    function renderExplore() {
      const prev = document.getElementById("eq");
      const qValue = prev ? prev.value : exploreQuery;
      exploreQuery = qValue;
      const q = qValue.trim().toLowerCase();
      const keepFocus = document.activeElement === prev;
      const caret = prev && typeof prev.selectionStart === "number" ? prev.selectionStart : qValue.length;
      const filtered = events.filter(e => {
        const catOk = !exploreCategory || e.category === exploreCategory;
        const whenOk = matchesWhen(e);
        const qOk = !q || e.title.toLowerCase().includes(q) || e.category.toLowerCase().includes(q) || e.location.toLowerCase().includes(q) || e.area.toLowerCase().includes(q);
        return catOk && whenOk && qOk;
      });
      const catChips = chipHtml("Todos", !exploreCategory, `data-cat=""`) +
        categories.map(c => chipHtml(c, exploreCategory === c, `data-cat="${c}"`)).join("");
      const whenChips = whenFilters.map(w => chipHtml(w.label, exploreWhen === w.id, `data-when="${w.id}"`)).join("");
      const body = filtered.length
        ? `<div class="saved-grid">${filtered.map(posterHtml).join("")}</div>`
        : emptyExploreHtml();
      document.getElementById("explore").innerHTML = `
        <div class="saved-head">
          <div class="section-name">EXPLORAR</div>
          <div class="slash"></div>
          <p class="section-sub">Cava a cidade do seu jeito</p>
        </div>
        <div class="search-wrap">
          <span class="icon" aria-hidden="true">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-3.5-3.5"></path>
            </svg>
          </span>
          <input class="search" id="eq" placeholder="Buscar um rolê" value="${qValue.replace(/"/g, "&quot;")}" />
        </div>
        <div class="filter-label">CATEGORIA</div>
        <div class="chips" id="cat-chips">${catChips}</div>
        <div class="filter-label">QUANDO</div>
        <div class="chips" id="when-chips">${whenChips}</div>
        ${body}
      `;
      document.querySelectorAll("#cat-chips .chip").forEach(btn => {
        btn.onclick = () => {
          const value = btn.getAttribute("data-cat") || null;
          exploreCategory = value || null;
          renderExplore();
        };
      });
      document.querySelectorAll("#when-chips .chip").forEach(btn => {
        btn.onclick = () => {
          exploreWhen = btn.getAttribute("data-when") || "todos";
          renderExplore();
        };
      });
      document.querySelectorAll("#explore .poster").forEach(card => {
        card.onclick = () => openDetail(card.getAttribute("data-id"), "explore");
      });
      document.querySelectorAll("#explore .heart").forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          toggleFav(btn.getAttribute("data-id"));
          renderExplore();
        };
      });
      const clear = document.getElementById("clear-explore");
      if (clear) clear.onclick = () => {
        exploreQuery = "";
        exploreCategory = null;
        exploreWhen = "todos";
        renderExplore();
      };
      const input = document.getElementById("eq");
      input.addEventListener("input", renderExplore);
      if (keepFocus) {
        input.focus();
        input.setSelectionRange(caret, caret);
      }
    }
    function openExplore() {
      renderExplore();
      showTab("explore");
    }
    function renderSaved() {
      const saved = events.filter(e => favorites.has(e.id));
      let body;
      if (!saved.length) {
        body = `<div class="empty"><h4>Nada na toca</h4><p>Marca o coração num evento pra achar ele aqui.</p></div>`;
      } else {
        body = `<div class="saved-grid">${saved.map(posterHtml).join("")}</div>`;
      }
      document.getElementById("saved").innerHTML = `
        <div class="saved-head">
          <div class="section-name">SALVOS</div>
          <div class="slash"></div>
          <p class="section-sub">Pra não perder de vista</p>
        </div>
        ${body}
      `;
      document.querySelectorAll("#saved .poster").forEach(card => {
        card.onclick = () => openDetail(card.getAttribute("data-id"), "saved");
      });
      document.querySelectorAll("#saved .heart").forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          const id = btn.getAttribute("data-id");
          toggleFav(id);
          renderSaved();
        };
      });
    }
    function openSaved() {
      renderSaved();
      showTab("saved");
    }
    function renderYou() {
      const count = favorites.size;
      const label = count === 1 ? "ROLÊ SALVO" : "ROLÊS SALVOS";
      const hint = count === 0
        ? "Marca o coração num evento pra contar aqui."
        : "Abre a lista dos que você marcou.";
      document.getElementById("you").innerHTML = `
        <div class="saved-head">
          <div class="section-name">VOCÊ</div>
          <div class="slash"></div>
          <p class="section-sub">Sem conta. Seus rolês ficam neste aparelho.</p>
        </div>
        <div class="you-card" id="you-saved">
          <div class="you-count">${count}</div>
          <div class="you-count-label">${label}</div>
          <p class="you-hint">${hint}</p>
        </div>
        <div class="filter-label">SOBRE</div>
        <p class="you-about pad">A toupeira cava Brasília pra você — shows, cultura e o que não aparece no folder.</p>
        <div class="filter-label">CIDADE</div>
        <p class="you-city pad">Brasília / DF</p>
      `;
      document.getElementById("you-saved").onclick = openSaved;
    }
    function openYou() {
      renderYou();
      showTab("you");
    }
    function goBackFromDetail() {
      if (detailFrom === "saved") {
        renderSaved();
        showTab("saved");
      } else if (detailFrom === "explore") {
        renderExplore();
        showTab("explore");
      } else {
        goHome();
      }
    }
    function eventFacts(e) {
      const rows = [
        { label: "Quando", value: formatWhen(e) },
        { label: "Onde", value: e.location },
        { label: "Preço", value: e.price, kind: "price" }
      ];
      if (e.ageRating) rows.push({ label: "Classificação", value: e.ageRating, kind: "stamp" });
      (e.facts || []).forEach(fact => rows.push(fact));
      return rows;
    }
    function ratingKey(value) {
      const text = String(value || "").trim();
      if (/^livre$|^l$/i.test(text)) return "l";
      const digits = (text.match(/\d+/) || [])[0];
      if (digits === "10" || digits === "12" || digits === "14" || digits === "16" || digits === "18") return digits;
      return "";
    }
    function factHtml(fact) {
      if (fact.kind === "stamp") {
        const key = ratingKey(fact.value);
        const mark = key === "l" ? "L" : (key || fact.value);
        const cls = key ? " r-" + key : "";
        return `<div class="fact"><span class="fact-label">${fact.label}</span><span class="rating${cls}">${mark}</span></div>`;
      }
      const value = `<span class="fact-value${fact.kind === "price" ? " lime" : ""}">${fact.value}</span>`;
      return `<div class="fact"><span class="fact-label">${fact.label}</span>${value}</div>`;
    }
    function eventShareText(e) {
      let text = e.title;
      eventFacts(e).forEach(fact => { text += "\n" + fact.label + ": " + fact.value; });
      if (e.link) text += "\n" + e.link;
      return text + "\n\nRowlê — Brasília";
    }
    function showCopied() {
      const toast = document.getElementById("toast");
      toast.hidden = false;
      clearTimeout(showCopied.timer);
      showCopied.timer = setTimeout(() => { toast.hidden = true; }, 1600);
    }
    function shareEvent(e) {
      const text = eventShareText(e);
      if (navigator.share) {
        navigator.share({ title: e.title, text }).catch(() => copyShare(text));
      } else {
        copyShare(text);
      }
    }
    function copyShare(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied, showCopied);
      } else {
        showCopied();
      }
    }
    function openDetail(id, from) {
      if (from) detailFrom = from;
      const e = events.find(x => x.id === id);
      if (!e) return;
      const more = e.link
        ? `<button class="ticket" type="button" id="open-link">SAIBA MAIS</button>`
        : "";
      document.getElementById("detail").innerHTML = `
        <div class="detail-bar">
          <button class="back" onclick="goBackFromDetail()">←</button>
          ${heartButton(e.id)}
        </div>
        <div class="cover style-${posterStyle(e)}"${coverAttr(e)}>
          ${scrimHtml(e)}
          <span class="poster-mark" aria-hidden="true">${posterMark(e)}</span>
          <span class="badge ${e.category}">${e.category.toUpperCase()}</span>
          <div class="poster-title">${e.title}</div>
        </div>
        <div class="sheet">${eventFacts(e).map(factHtml).join("")}</div>
        <div class="detail-body">
          <h2>SOBRE</h2>
          <div class="slash"></div>
          <p class="desc">${e.description}</p>
          <button class="share" type="button" id="share-event">COMPARTILHAR</button>
          ${more}
        </div>
      `;
      document.querySelectorAll("#detail .heart").forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          const favId = btn.getAttribute("data-id");
          toggleFav(favId);
          openDetail(favId);
        };
      });
      document.getElementById("share-event").onclick = () => shareEvent(e);
      const linkBtn = document.getElementById("open-link");
      if (linkBtn) linkBtn.onclick = () => window.open(e.link, "_blank");
      showTab("detail");
    }
    function goHome() {
      renderHome();
      showTab("home");
    }
    function showTab(id) {
      ["home", "explore", "saved", "you", "detail"].forEach(s => {
        document.getElementById(s).hidden = s !== id;
      });
      document.getElementById("nav").hidden = id === "detail";
      document.getElementById("nav-home").classList.toggle("on", id === "home");
      document.getElementById("nav-explore").classList.toggle("on", id === "explore");
      document.getElementById("nav-saved").classList.toggle("on", id === "saved");
      document.getElementById("nav-you").classList.toggle("on", id === "you");
    }
    renderHome();
  </script>
</body>
</html>
