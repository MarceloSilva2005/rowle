<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rowlê</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #C8FF00;
      --on-primary: #000;
      --bg: #000;
      --surface: #111;
      --on-bg: #fff;
      --on-surface: #fff;
      --muted: #B3B3B3;
    }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .phone {
      width: 390px;
      height: 780px;
      background: var(--bg);
      color: var(--on-bg);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .screen { flex: 1; overflow: auto; padding: 20px 0 16px; }
    .screen.detail { padding: 20px 16px 16px; }
    .pad { padding: 0 16px; }
    h1 {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 32px;
      margin: 0 0 8px;
    }
    .brand { margin-bottom: 14px; }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .brand-row .pin {
      width: 26px;
      height: 26px;
      color: var(--primary);
      flex-shrink: 0;
    }
    .wordmark {
      font-family: "Barlow Condensed", sans-serif;
      color: var(--primary);
      font-size: 34px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .city {
      margin-left: auto;
      font-family: "Barlow Condensed", sans-serif;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      border: 1px solid var(--primary);
      border-radius: 4px;
      padding: 4px 8px;
    }
    .subtitle { color: var(--muted); margin: 8px 0 0; }
    .places {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding: 0 16px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }
    .places::-webkit-scrollbar { display: none; }
    .place {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      letter-spacing: 0.14em;
      font-size: 13px;
      color: color-mix(in srgb, var(--primary) 40%, transparent);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      white-space: nowrap;
    }
    .place.on { color: var(--primary); }
    .dot { color: color-mix(in srgb, var(--primary) 45%, transparent); }
    .search {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #2A2A2A;
      border-radius: 14px;
      padding: 14px 14px 14px 42px;
      font-size: 16px;
      background: var(--surface);
      color: var(--on-surface);
      outline: none;
    }
    .search-wrap { position: relative; margin: 16px 16px 8px; }
    .search-wrap .icon {
      position: absolute;
      left: 14px;
      top: 13px;
      width: 18px;
      height: 18px;
      color: var(--muted);
    }
    .icon-svg { width: 18px; height: 18px; display: block; }
    .section { padding: 12px 16px 4px; }
    .section-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 40px;
      line-height: 1;
    }
    .section-sub { color: var(--muted); margin: 6px 0 0; font-size: 13px; }
    .row-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 16px 16px;
      scrollbar-width: none;
    }
    .row-scroll::-webkit-scrollbar { display: none; }
    .poster { width: 200px; flex-shrink: 0; cursor: pointer; }
    .poster-cover {
      height: 248px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      background: #1A1A1A;
    }
    .poster-cover.Shows { background: #2A1020; }
    .poster-cover.Cultura { background: #1A1228; }
    .poster-cover.Tecnologia { background: #102418; }
    .poster-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,.9));
    }
    .badge {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 1;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      border-radius: 4px;
      padding: 4px 8px;
    }
    .badge.Shows { background: #FF4FA3; color: #fff; }
    .badge.Cultura { background: #C77DFF; color: #fff; }
    .badge.Tecnologia { background: var(--primary); color: #000; }
    .heart {
      background: none;
      border: 0;
      padding: 6px;
      color: #fff;
      cursor: pointer;
      z-index: 2;
    }
    .heart.on { color: var(--primary); }
    .heart svg { width: 24px; height: 24px; display: block; }
    .poster-cover .heart {
      position: absolute;
      top: 8px;
      right: 8px;
    }
    .detail-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .poster-title {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 1;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 24px;
      line-height: 1.05;
      text-transform: uppercase;
    }
    .poster-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cover {
      height: 200px;
      position: relative;
      background: #1A1A1A;
      margin: 0 -16px 16px;
    }
    .cover.Shows { background: #2A1020; }
    .cover.Cultura { background: #1A1228; }
    .cover.Tecnologia { background: #102418; }
    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,.8));
    }
    .meta-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      margin: 4px 0;
    }
    .meta-line svg { width: 16px; height: 16px; flex-shrink: 0; }
    .price { color: var(--primary); font-weight: 700; margin-top: 6px; }
    .empty { text-align: center; padding: 28px 24px 12px; }
    .empty h4 { margin: 0 0 8px; font-size: 22px; font-family: "Barlow Condensed", sans-serif; font-style: italic; font-weight: 900; }
    .empty p { margin: 0; color: var(--muted); }
    .empty button {
      margin-top: 16px;
      border: 1px solid var(--primary);
      background: transparent;
      color: var(--primary);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .soon {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .soon h2 {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 40px;
      margin: 0;
    }
    .soon p { color: var(--muted); margin: 0; }
    .saved-head { padding: 4px 16px 8px; }
    .saved-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 12px;
      padding: 8px 16px 16px;
    }
    .saved-grid .poster { width: auto; }
    .nav {
      display: flex;
      gap: 8px;
      padding: 8px 12px 12px;
      background: var(--bg);
      border-top: 1px solid color-mix(in srgb, var(--muted) 25%, transparent);
    }
    .nav[hidden] { display: none; }
    .nav button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 10px 4px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      background: transparent;
      color: #8A8A8A;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .nav button.on {
      background: var(--primary);
      color: var(--on-primary);
    }
    .back {
      border: 0;
      background: transparent;
      color: var(--on-bg);
      font-size: 22px;
      cursor: pointer;
      padding: 0 0 12px;
    }
    .desc { color: var(--muted); line-height: 1.45; font-size: 16px; }
    .ticket {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 16px;
      cursor: pointer;
    }
    .hint {
      position: absolute;
      bottom: 16px;
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="screen" id="home"></div>
    <div class="screen" id="explore" hidden>
      <div class="soon"><h2>EXPLORAR</h2><p>Essa aba ainda vai entrar.</p></div>
    </div>
    <div class="screen" id="saved" hidden></div>
    <div class="screen" id="you" hidden>
      <div class="soon"><h2>VOCÊ</h2><p>Essa aba ainda vai entrar.</p></div>
    </div>
    <div class="screen detail" id="detail" hidden></div>
    <div class="nav" id="nav">
      <button id="nav-home" class="on" onclick="showTab('home')">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"></path></svg>
        INÍCIO
      </button>
      <button id="nav-explore" onclick="showTab('explore')">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        EXPLORAR
      </button>
      <button id="nav-saved" onclick="openSaved()">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10z"></path></svg>
        SALVOS
      </button>
      <button id="nav-you" onclick="showTab('you')">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z"></path></svg>
        VOCÊ
      </button>
    </div>
  </div>
  <p class="hint">Preview no navegador — o app real é Android/iOS</p>
  <script>
    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }
    function addDays(d, n) {
      const x = new Date(d);
      x.setDate(x.getDate() + n);
      return startOfDay(x);
    }
    function nextDow(from, dow) {
      const x = startOfDay(from);
      while (x.getDay() !== dow) x.setDate(x.getDate() + 1);
      return startOfDay(x);
    }
    const today = startOfDay(new Date());
    const tomorrow = addDays(today, 1);
    const saturday = nextDow(today, 6);
    const sunday = nextDow(today, 0);
    const months = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    function sameDay(a, b) { return a.getTime() === b.getTime(); }
    function thisWeekend() {
      const dow = today.getDay();
      if (dow === 6) return { sat: today, sun: addDays(today, 1) };
      if (dow === 0) return { sat: addDays(today, -1), sun: today };
      return { sat: saturday, sun: sunday };
    }
    function dateLabel(date) {
      const w = thisWeekend();
      if (sameDay(date, today)) return "Hoje";
      if (sameDay(date, tomorrow)) return "Amanhã";
      if (sameDay(date, w.sat)) return "Sábado";
      if (sameDay(date, w.sun)) return "Domingo";
      return date.getDate() + " " + months[date.getMonth()];
    }
    function formatWhen(e) { return dateLabel(e.date) + " • " + e.time; }
    function iconCal() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>';
    }
    function iconPin() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>';
    }
    const areas = ["Norte", "Asa Sul", "Pontão", "Conic", "UnB"];
    const events = [
      { id: "1", title: "Festival de Tecnologia de Brasília", description: "Palestras, oficinas e networking com a cena de tecnologia do DF. Aberto a estudantes, devs e curiosos.", category: "Tecnologia", date: today, time: "14:00", location: "CIC — Asa Norte", area: "Norte", price: "Grátis" },
      { id: "2", title: "Show de Rock em Brasília", description: "Noite de bandas locais e clássicos do rock. Chegue cedo: o espaço costuma lotar no fim de semana.", category: "Shows", date: tomorrow, time: "20:00", location: "Asa Sul", area: "Asa Sul", price: "R$ 40", ticketUrl: "https://www.sympla.com.br" },
      { id: "3", title: "Feira Cultural de Brasília", description: "Arte, cultura, gastronomia e atrações para toda a família no Plano Piloto.", category: "Cultura", date: saturday, time: "10:00", location: "Pontão do Lago Sul", area: "Pontão", price: "Grátis" },
      { id: "4", title: "Samba no Parque", description: "Roda de samba ao ar livre com comida de boteco e espaço para dançar. Entrada franca.", category: "Shows", date: saturday, time: "16:00", location: "UnB", area: "UnB", price: "Grátis" },
      { id: "5", title: "Mostra de Cinema no Cine Brasília", description: "Sessões de cinema brasileiro e debates com realizadores. Classificação indicativa na bilheteria.", category: "Cultura", date: sunday, time: "19:30", location: "Conic", area: "Conic", price: "R$ 20" }
    ].sort((a, b) => a.date - b.date || a.time.localeCompare(b.time));
    let selectedArea = null;
    let detailFrom = "home";
    const FAV_KEY = "rowle.favorites";
    const favorites = new Set();
    function loadFavorites() {
      try {
        const raw = localStorage.getItem(FAV_KEY);
        if (!raw) return;
        JSON.parse(raw).forEach(id => favorites.add(id));
      } catch (e) {}
    }
    function persistFavorites() {
      localStorage.setItem(FAV_KEY, JSON.stringify([...favorites]));
    }
    function toggleFav(id) {
      if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
      persistFavorites();
    }
    loadFavorites();
    function heartSvg(on) {
      return on
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10z"></path></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.1 8.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10S5 16.4 5 11a4 4 0 0 1 7.1-2.4z"></path></svg>';
    }
    function heartButton(id) {
      const on = favorites.has(id);
      return `<button type="button" class="heart ${on ? "on" : ""}" data-id="${id}" aria-label="${on ? "Remover dos salvos" : "Salvar evento"}">${heartSvg(on)}</button>`;
    }
    function posterHtml(e) {
      return `
        <div class="poster" data-id="${e.id}">
          <div class="poster-cover ${e.category}">
            <span class="badge ${e.category}">${e.category.toUpperCase()}</span>
            ${heartButton(e.id)}
            <div class="poster-title">${e.title}</div>
          </div>
          <div class="poster-meta">${formatWhen(e)}</div>
          <div class="poster-meta">${e.location}  ·  ${e.price}</div>
        </div>`;
    }
    function emptyHtml() {
      const q = (document.getElementById("q")?.value || "").trim();
      let title = "Nenhum evento por aqui";
      let subtitle = "Quando tiver rolê novo, aparece nessa lista.";
      if (q) {
        title = "Nada por “" + q + "”";
        subtitle = "Tenta outro nome, ou limpa a busca e os filtros.";
      } else if (selectedArea) {
        title = "Nenhum rolê em " + selectedArea;
        subtitle = "Escolhe outro lugar ou vê todos os eventos.";
      }
      const hasFilters = q || selectedArea;
      const btn = hasFilters ? `<button type="button" id="clear-filters">Limpar filtros</button>` : "";
      return `<div class="empty"><h4>${title}</h4><p>${subtitle}</p>${btn}</div>`;
    }
    function renderHome() {
      const prev = document.getElementById("q");
      const qValue = prev ? prev.value : "";
      const q = qValue.toLowerCase();
      const keepFocus = document.activeElement === prev;
      const caret = prev && typeof prev.selectionStart === "number" ? prev.selectionStart : qValue.length;
      const filtered = events.filter(e => {
        const areaOk = !selectedArea || e.area === selectedArea;
        const qOk = !q || e.title.toLowerCase().includes(q) || e.category.toLowerCase().includes(q) || e.location.toLowerCase().includes(q) || e.area.toLowerCase().includes(q);
        return areaOk && qOk;
      });
      const emAlta = filtered.filter(e => !sameDay(e.date, today));
      const hoje = filtered.filter(e => sameDay(e.date, today));
      const places = areas.map((area, i) => {
        const dot = i === 0 ? "" : `<span class="dot">·</span>`;
        return `${dot}<button class="place ${selectedArea === area ? "on" : ""}" data-area="${area}">${area.toUpperCase()}</button>`;
      }).join("");
      let body;
      if (!filtered.length) {
        body = emptyHtml();
      } else {
        body = "";
        if (emAlta.length) {
          body += `
            <div class="section">
              <div class="section-name">EM ALTA</div>
              <p class="section-sub">O que mais tá saindo essa semana</p>
            </div>
            <div class="row-scroll">${emAlta.map(posterHtml).join("")}</div>`;
        }
        if (hoje.length) {
          body += `
            <div class="section">
              <div class="section-name">HOJE</div>
              <p class="section-sub">Ainda dá tempo de ir</p>
            </div>
            <div class="row-scroll">${hoje.map(posterHtml).join("")}</div>`;
        }
      }
      document.getElementById("home").innerHTML = `
        <div class="brand pad">
          <div class="brand-row">
            <svg class="pin" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"></path>
            </svg>
            <span class="wordmark">ROWLÊ</span>
            <span class="city">BSB / DF</span>
          </div>
          <p class="subtitle">O que tá rolando em Brasília hoje.</p>
        </div>
        <div class="places">${places}</div>
        <div class="search-wrap">
          <span class="icon" aria-hidden="true">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-3.5-3.5"></path>
            </svg>
          </span>
          <input class="search" id="q" placeholder="Buscar um evento" value="${qValue.replace(/"/g, "&quot;")}" />
        </div>
        ${body}
      `;
      document.querySelectorAll(".place").forEach(btn => {
        btn.onclick = () => {
          const value = btn.getAttribute("data-area");
          selectedArea = selectedArea === value ? null : value;
          renderHome();
        };
      });
      document.querySelectorAll(".poster").forEach(card => {
        card.onclick = () => openDetail(card.getAttribute("data-id"), "home");
      });
      document.querySelectorAll("#home .heart").forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          const id = btn.getAttribute("data-id");
          toggleFav(id);
          renderHome();
        };
      });
      const input = document.getElementById("q");
      input.addEventListener("input", renderHome);
      const clear = document.getElementById("clear-filters");
      if (clear) clear.onclick = () => {
        selectedArea = null;
        document.getElementById("q").value = "";
        renderHome();
      };
      if (keepFocus) {
        input.focus();
        input.setSelectionRange(caret, caret);
      }
    }
    function renderSaved() {
      const saved = events.filter(e => favorites.has(e.id));
      let body;
      if (!saved.length) {
        body = `<div class="empty"><h4>Nenhum rolê salvo</h4><p>Marca o coração num evento pra achar ele aqui.</p></div>`;
      } else {
        body = `<div class="saved-grid">${saved.map(posterHtml).join("")}</div>`;
      }
      document.getElementById("saved").innerHTML = `
        <div class="saved-head">
          <div class="section-name">SALVOS</div>
          <p class="section-sub">Os rolês que você marcou</p>
        </div>
        ${body}
      `;
      document.querySelectorAll("#saved .poster").forEach(card => {
        card.onclick = () => openDetail(card.getAttribute("data-id"), "saved");
      });
      document.querySelectorAll("#saved .heart").forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          const id = btn.getAttribute("data-id");
          toggleFav(id);
          renderSaved();
        };
      });
    }
    function openSaved() {
      renderSaved();
      showTab("saved");
    }
    function goBackFromDetail() {
      if (detailFrom === "saved") {
        renderSaved();
        showTab("saved");
      } else {
        goHome();
      }
    }
    function openDetail(id, from) {
      if (from) detailFrom = from;
      const e = events.find(x => x.id === id);
      if (!e) return;
      const ticket = e.ticketUrl
        ? `<button class="ticket" onclick="window.open('${e.ticketUrl}', '_blank')">Ver ingressos</button>`
        : "";
      document.getElementById("detail").innerHTML = `
        <div class="detail-bar">
          <button class="back" onclick="goBackFromDetail()">←</button>
          ${heartButton(e.id)}
        </div>
        <div class="cover ${e.category}"><span class="badge ${e.category}">${e.category.toUpperCase()}</span></div>
        <h1>${e.title}</h1>
        <p class="meta-line">${iconCal()} ${formatWhen(e)}</p>
        <p class="meta-line">${iconPin()} ${e.location}</p>
        <p class="price" style="font-size:20px">${e.price}</p>
        <h2 style="font-size:18px;margin:16px 0 8px">Sobre</h2>
        <p class="desc">${e.description}</p>
        ${ticket}
      `;
      document.querySelectorAll("#detail .heart").forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          const favId = btn.getAttribute("data-id");
          toggleFav(favId);
          openDetail(favId);
        };
      });
      showTab("detail");
    }
    function goHome() {
      renderHome();
      showTab("home");
    }
    function showTab(id) {
      ["home", "explore", "saved", "you", "detail"].forEach(s => {
        document.getElementById(s).hidden = s !== id;
      });
      document.getElementById("nav").hidden = id === "detail";
      document.getElementById("nav-home").classList.toggle("on", id === "home");
      document.getElementById("nav-explore").classList.toggle("on", id === "explore");
      document.getElementById("nav-saved").classList.toggle("on", id === "saved");
      document.getElementById("nav-you").classList.toggle("on", id === "you");
    }
    renderHome();
  </script>
</body>
</html>
